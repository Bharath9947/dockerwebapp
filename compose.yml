version: "3.9"

services:
  devopsdb:
    container_name: devopsdb
    build: ./Docker-db/
    ports:
      - "3306:3306"
    networks:
      - mynetwork

  application:
    container_name: app-db
    build: ./Docker-app/
    ports:
      - "1111:8080"
    depends_on:
      - devopsdb
    networks:
      - mynetwork

networks:
  mynetwork:
    driver: overlay
